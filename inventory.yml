buildmachines:
  vars:
      ansible_ssh_pipelining: true
      ansible_become_method: doas
      ansible_python_interpreter: /usr/local/bin/python2.7
  hosts:
    obsd-build.virt:
      openbsd_installurl: http://ftp.icm.edu.pl/pub/OpenBSD/
      openbsd_cvsmirror: anoncvs.eu.openbsd.org
      ansible_user: root
      ansible_host: 192.168.122.10
      ansible_ssh_private_key_file: obsd-build-access

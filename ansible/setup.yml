---
- name: Setup build machine
  hosts: obsd-build
  gather_facts: false
  tasks:
    - name: Set installurl
      ansible.builtin.raw: "echo {{ openbsd_mirror }}/pub/OpenBSD > /etc/installurl"
      args:
        creates: /etc/installurl

    - name: Install python
      ansible.builtin.raw: type python3 >/dev/null || pkg_add python%3
      args:
        creates: /usr/local/bin/python3

    - name: Install needed packages
      ansible.builtin.raw: pkg_add {{ item.pkg }}
      args:
        creates: "{{ item.bin }}"
      loop:
        - pkg: vim--no_x11
          bin: /usr/local/bin/vim
        - pkg: git
          bin: /usr/local/bin/git
        - pkg: mercurial
          bin: /usr/local/bin/hg

    - name: Install system config files
      block:
        - name: Create download dir
          ansible.builtin.file:
            state: directory
            dest: /var/downloads
            mode: "0775"

        - name: "Install {{ item.dst }}"
          ansible.builtin.copy:
            src: "{{ item.src }}"
            dest: "{{ item.dst }}"
            owner: root
            group: wheel
            mode: "0644"
            force: true
          loop:
            - src: files/mk.conf
              dst: /etc/mk.conf
            - src: files/man.conf
              dst: /etc/man.conf
            - src: files/doas.conf
              dst: /etc/doas.conf

    - name: Install root's config files
      block:
        - name: Fix root .profile
          ansible.builtin.blockinfile:
            insertafter: EOF
            path: /root/.profile
            content: "{{ lookup('file', 'files/root-profile.snip') }}"
        - name: Install other root configs
          ansible.builtin.copy:
            src: "{{ item.src }}"
            dest: "{{ item.dst }}"
            owner: root
            group: wheel
            mode: "0600"
            force: true
          loop:
            - src: files/root-kshrc
              dst: /root/.kshrc
            - src: files/root-vimrc
              dst: /root/.vimrc
            - src: files/root-tmux.conf
              dst: /root/.tmux.conf

    - name: Create /dest file tree
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: build
        mode: "0700"
      loop:
        - /dest
        - /var/dest
        - /var/dest/base
        - /var/dest/xbase

    - name: Create /dest mfs mount
      ansible.posix.mount:
        state: mounted
        path: /dest
        src: swap
        fstype: mfs
        opts: rw,nosuid,noperm,-P/var/dest,-s1.5G,noauto
        dump: 0
        passno: 0
        boot: false

    - name: Enable serial console on boot
      ansible.builtin.copy:
        dest: /etc/boot.conf
        src: boot.conf
        owner: root
        group: wheel
        mode: u=rw,go=r

    - name: Install serial term size fix script
      ansible.builtin.copy:
        dest: /usr/local/bin/ttycom0fix.sh
        src: ttycom0fix.sh
        mode: u=rwx,go=rx
        owner: root
        group: bin

    - name: Set up serial console
      ansible.builtin.lineinfile:
        path: /etc/ttys
        regexp: ^console
        line: console "/usr/libexec/getty std.115200" vt220 on secure local

    - name: Create login class for srcfetch
      ansible.builtin.blockinfile:
        path: /etc/login.conf
        validate: cap_mkdb %s
        block: |
          srcfetch:\
              :umask=002:\
              :tc=default:

    - name: Create source owner user
      ansible.builtin.user:
        name: srcfetch
        comment: source owner user
        login_class: srcfetch
        group: wsrc
        groups: wobj
        shell: /sbin/nologin
        home: /var/srcfetch
        system: true
        createhome: true

    - name: Create srcfetch .ssh dir
      ansible.builtin.file:
        state: directory
        path: /var/srcfetch/.ssh
        owner: srcfetch
        mode: "0700"

    - name: Create srcfetch .ssh/known_hosts file
      ansible.builtin.file:
        state: touch
        path: /var/srcfetch/.ssh/known_hosts
        owner: srcfetch
        mode: "0600"

    - name: Create /usr/obj system directories
      ansible.builtin.file:
        path: /usr/obj/{{ item }}
        state: directory
        owner: build
        group: wobj
        mode: "0770"
      loop:
        - bsd
        - x11

    - name: Create /usr/obj ports directories
      ansible.builtin.file:
        path: /usr/obj/{{ item }}
        state: directory
        owner: _pbuild
        group: _pbuild
        mode: "0775"
      loop:
        - ports
        - ports.bulk
        - ports.update
        - ports.locks

    - name: Create /var/ports directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: _dpb
        mode: "{{ item.mode | default('0770') }}"
      loop:
        - path: /var/ports
          owner: _pbuild
          mode: "0775"
        - path: /var/ports/plist
          owner: _pbuild
        - path: /var/ports/distfiles
          owner: _pbuild
        - path: /var/ports/packages
          owner: _pbuild
        - path: /var/ports/log
          owner: _pbuild

    - name: Create ports buildlist
      ansible.builtin.copy:
        src: files/buildlist
        dest: /var/ports/buildlist
        owner: _pbuild
        group: wobj
        mode: "0444"

    - name: Create releasedir
      ansible.builtin.file:
        path: /var/release
        state: directory
        owner: build
        mode: "0755"

    - name: Create directories for sources
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: srcfetch
        group: wsrc
        mode: "0775"
      loop:
        - path: /usr/src
        - path: /usr/xenocara
        - path: /usr/ports
        - path: /usr/local/ports
        - path: /usr/local/ports/gh-wip
        - path: /usr/local/ports/my

    - name: Checkout git ports repos
      become: true
      become_user: srcfetch

      block:
        - name: Install my ports tree # noqa: latest
          ansible.builtin.git:
            dest: /usr/local/ports/my
            repo: https://pzskc383.dp.ua/code/openbsd-ports
    - name: Remove /usr/xobj
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/xobj

    - name: Record CVS server ssh hostkey
      become: true
      become_user: srcfetch

      block:
        - name: Create known_hosts
          ansible.builtin.file:
            state: touch
            path: /var/srcfetch/.ssh/known_hosts
            owner: "srcfetch"
            mode: "0644"

        - name: Cleanup known_hosts
          ansible.builtin.shell: ssh-keygen -R {{ openbsd_anoncvs }} 2>/dev/null
          changed_when: true

        - name: Record cvs hostkey in known_hosts
          ansible.builtin.shell: ssh-keyscan {{ openbsd_anoncvs }} 2>/dev/null >>/var/srcfetch/.ssh/known_hosts
          changed_when: true

    - name: "CVS checkout: {{ item }}"
      ansible.builtin.command: cvs -qd anoncvs@{{ openbsd_anoncvs }}:/cvs get -P {{ item }}
      args:
        chdir: /usr
        creates: /usr/{{ item }}/CVS
      loop:
        - src
        - xenocara
        - ports
      become: true
      become_user: srcfetch
      changed_when: true

    - name: Fix source permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: srcfetch
        group: wsrc
        mode: ug=rwX,o=rX
        recurse: true
      loop:
        - path: /usr/src
        - path: /usr/xenocara
        - path: /usr/ports

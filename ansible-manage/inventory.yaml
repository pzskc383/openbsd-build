buildmachines:
  hosts:
    obsd-build-bjm.virt:
      openbsd_installurl: https://ftp.hostserver.de/pub/OpenBSD
      openbsd_cvsroot: anoncvs@ftp.hostserver.de:/cvs
      ansible_user: root
      ansible_host: 192.168.122.241
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      ansible_python_interpreter: /usr/local/bin/python2.7
      ansible_ssh_common_args: -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/id_ed25519 bjm"
      ansible_ssh_pipelining: true


---
- hosts: all
  gather_facts: false
  tasks:
  - name: make kernel obj
    make:
      target: obj
      chdir: /sys/arch/amd64/compile/GENERIC

  - name: make kernel config
    make:
      target: config
      chdir: /sys/arch/amd64/compile/GENERIC

  - name: make kernel
    make:
      chdir: /sys/arch/amd64/compile/GENERIC

  - name: install kernel
    make:
      target: install
      chdir: /sys/arch/amd64/compile/GENERIC

  - name: reboot machine
    command: reboot

  - name: wait for it
    wait_for_connection:

  - name: make base system obj
    make:
      target: obj
      chdir: /usr/src

  - name: build base system
    make:
      target: build
      chdir: /usr/src

  - name: run sysmerge
    command: sysmerge -b

  - name: run MAKEDEV
    shell: "cd /dev && ./MAKEDEV all"

  - name: mount /dest
    command: mount /dest

  - name: make base release
    make:
      target: release
      chdir: /usr/src/etc
      params:
        DESTDIR: /dest/base
        RELEASEDIR: /var/release

  - name: check file list
    shell: cd /usr/src/distrib/sets && env RELEASEDIRDIR=/var/release DESTDIR=/dest/base sh checkflist

  - name: bootstrap xenocara
    make:
      target: bootstrap
      chdir: /usr/xenocara

  - name: make xenocara obj
    make:
      target: obj
      chdir: /usr/xenocara

  - name: build xenocara
    make:
      target: build
      chdir: /usr/xenocara

  - name: make xenocara release
    make:
      target: release
      chdir: /usr/xenocara
      params:
        DESTDIR: /dest/xbase
        RELEASEDIR: /var/release

  - name: check xenocara release
    make:
      target: checkdist
      chdir: /usr/xenocara
      params:
        DESTDIR: /dest/xbase
        RELEASEDIR: /var/release

  - name: create install images
    make:
      chdir: /usr/src/distrib/amd64/iso
      params:
        RELDIR: /var/release
        RELXDIR: /var/release

  - name: install install images (...)
    make:
      target: install
      chdir: /usr/src/distrib/amd64/iso
      params:
        RELDIR: /var/release
        RELXDIR: /var/release
